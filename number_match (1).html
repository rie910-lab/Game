<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Match</title>
<style>
  :root {
    --ink: #1F2430;
    --paper: #FFF8EC;
    --sun: #FFC857;
    --sky: #4C9AFF;
    --coral: #FF6B5E;
    --leaf: #3CB371;
    --plum: #6C5CE7;
    --card-back: #6C5CE7;
    --card-back-2: #8E7CF0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    min-height: 100%;
  }

  .stage {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  .top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }

  h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    line-height: 1.05;
  }

  h1 span {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--plum);
    letter-spacing: 0;
    margin-top: 4px;
  }

  .stats {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  .stat {
    background: white;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 8px 14px;
    text-align: center;
    min-width: 64px;
    box-shadow: 3px 3px 0 var(--ink);
  }

  .stat b {
    display: block;
    font-size: 20px;
    line-height: 1.1;
  }

  .stat small {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .level-btn {
    border: 2px solid var(--ink);
    background: white;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s ease;
  }

  .level-btn:hover { transform: translateY(-2px); }

  .level-btn.active {
    background: var(--sun);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .card {
    aspect-ratio: 1 / 1;
    perspective: 800px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.45s cubic-bezier(.2,.8,.3,1.2);
  }

  .card.flipped .card-inner,
  .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    backface-visibility: hidden;
    font-weight: 800;
    text-align: center;
    padding: 4px;
  }

  .face-back {
    background: linear-gradient(155deg, var(--card-back), var(--card-back-2));
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
  }

  .face-back::after {
    content: "?";
    color: rgba(255,255,255,0.85);
    font-size: 28px;
  }

  .face-front {
    background: white;
    border: 2px solid var(--ink);
    transform: rotateY(180deg);
    font-size: 20px;
    line-height: 1.15;
    word-break: break-word;
  }

  .card.matched .face-front {
    background: var(--leaf);
    color: white;
  }

  .card.wrong .face-front {
    background: var(--coral);
    color: white;
  }

  .card.matched {
    animation: pop 0.4s ease;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.08) rotateY(180deg); }
    100% { transform: scale(1) rotateY(180deg); }
  }

  .theme-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .prize-panel {
    background: white;
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 20px;
    box-shadow: 3px 3px 0 var(--ink);
    display: flex;
    align-items: center;
    gap: 16px;
    overflow: hidden;
    position: relative;
  }

  .prize-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #6b7280;
    white-space: nowrap;
  }

  .prize-stage {
    flex: 1;
    height: 92px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }

  .prize-stage svg {
    width: auto;
    height: 86px;
    transition: transform 1.1s cubic-bezier(.4,0,.2,1), opacity 1.1s ease;
  }

  .prize-stage.launching.space svg {
    transform: translateY(-220px) scale(0.85);
    opacity: 0;
  }

  .prize-stage.launching.ocean svg {
    transform: translateY(180px) scale(0.9);
    opacity: 0;
  }

  .prize-part {
    transition: opacity 0.35s ease, fill 0.35s ease;
  }

  .bubble {
    position: absolute;
    bottom: 0;
    border-radius: 50%;
    background: rgba(76, 154, 255, 0.35);
    animation: rise 1.3s ease-in forwards;
  }

  @keyframes rise {
    0%   { transform: translateY(0); opacity: 0.9; }
    100% { transform: translateY(-100px); opacity: 0; }
  }

  .flame {
    animation: flicker 0.18s infinite alternate;
  }

  @keyframes flicker {
    0%   { transform: scaleY(1) scaleX(1); }
    100% { transform: scaleY(1.25) scaleX(0.85); }
  }

  .banner {
    display: none;
    margin-top: 22px;
    background: white;
    border: 2px solid var(--ink);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    box-shadow: 4px 4px 0 var(--ink);
  }

  .feedback {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-16px);
    background: var(--ink);
    color: white;
    font-weight: 800;
    font-size: 16px;
    padding: 10px 22px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 10;
    white-space: nowrap;
  }

  .feedback.correct { background: var(--leaf); }
  .feedback.wrong { background: var(--coral); }

  .feedback.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .banner.show { display: block; }

  .banner h2 {
    margin: 0 0 6px;
    font-size: 22px;
  }

  .banner p {
    margin: 0 0 14px;
    color: #4b5563;
    font-size: 14px;
  }

  .again-btn {
    border: 2px solid var(--ink);
    background: var(--sky);
    color: white;
    font-weight: 800;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
  }

  @media (max-width: 460px) {
    .board { grid-template-columns: repeat(3, 1fr); }
    h1 { font-size: 26px; }
    .face-front { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="feedback" id="feedback"></div>
  <div class="top">
    <h1>Number Match<span>Flip two cards. Match the problem to its answer.</span></h1>
    <div class="stats">
      <div class="stat"><b id="moves">0</b><small>Moves</small></div>
      <div class="stat"><b id="time">0:00</b><small>Time</small></div>
      <button class="level-btn" id="muteBtn" style="align-self:center;">🔊</button>
    </div>
  </div>

  <div class="theme-row" id="themes">
    <button class="level-btn active" data-theme="space">🚀 Space</button>
    <button class="level-btn" data-theme="ocean">🌊 Ocean</button>
  </div>

  <div class="prize-panel">
    <div class="prize-label" id="prizeLabel">Fuel<br>0/6</div>
    <div class="prize-stage" id="prizeStage"></div>
  </div>

  <div class="controls" id="levels">
    <button class="level-btn active" data-level="easy">Easy (+ / −)</button>
    <button class="level-btn" data-level="medium">Medium (× up to 5)</button>
    <button class="level-btn" data-level="hard">Hard (× up to 10)</button>
  </div>

  <div class="board" id="board"></div>

  <div class="banner" id="banner">
    <h2 id="bannerTitle">Nice work!</h2>
    <p id="bannerText"></p>
    <button class="again-btn" id="againBtn">Play again</button>
  </div>
</div>

<script>
  const board = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timeEl = document.getElementById('time');
  const banner = document.getElementById('banner');
  const bannerTitle = document.getElementById('bannerTitle');
  const bannerText = document.getElementById('bannerText');
  const levelButtons = document.querySelectorAll('.level-btn[data-level]');
  const themeButtons = document.querySelectorAll('.level-btn[data-theme]');
  const prizeStage = document.getElementById('prizeStage');
  const prizeLabel = document.getElementById('prizeLabel');

  let level = 'easy';
  let theme = 'space';
  let moves = 0;
  let seconds = 0;
  let timerId = null;
  let flipped = [];
  let lockBoard = false;
  let matchedCount = 0;
  let totalPairs = 0;

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function makePairs(lvl) {
    const pairs = [];
    const usedQuestions = new Set();
    const usedAnswers = new Set();

    function addPair(question, answer) {
      if (usedQuestions.has(question)) return false;
      if (usedAnswers.has(answer)) return false;
      usedQuestions.add(question);
      usedAnswers.add(answer);
      pairs.push({ question, answer: String(answer) });
      return true;
    }

    const targetCount = lvl === 'hard' ? 8 : 6;
    let attempts = 0;
    const maxAttempts = 2000;

    while (pairs.length < targetCount && attempts < maxAttempts) {
      attempts++;
      if (lvl === 'easy') {
        const a = randInt(1, 12);
        const b = randInt(1, 12);
        const op = Math.random() < 0.5 ? '+' : '-';
        let x = a, y = b;
        if (op === '-' && x < y) { const t = x; x = y; y = t; }
        const answer = op === '+' ? x + y : x - y;
        addPair(`${x} ${op} ${y}`, answer);
      } else if (lvl === 'medium') {
        const a = randInt(2, 5);
        const b = randInt(2, 9);
        addPair(`${a} × ${b}`, a * b);
      } else {
        const a = randInt(2, 10);
        const b = randInt(2, 10);
        addPair(`${a} × ${b}`, a * b);
      }
    }
    return pairs;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startTimer() {
    clearInterval(timerId);
    seconds = 0;
    timeEl.textContent = '0:00';
    timerId = setInterval(() => {
      seconds++;
      const m = Math.floor(seconds / 60);
      const s = String(seconds % 60).padStart(2, '0');
      timeEl.textContent = `${m}:${s}`;
    }, 1000);
  }

  function buildRocketSVG(n) {
    const bodyTop = 48, bodyBottom = 118;
    const segGap = 2;
    const segH = (bodyBottom - bodyTop) / n;
    let segs = '';
    for (let i = 0; i < n; i++) {
      const y = bodyBottom - (i + 1) * segH;
      segs += `<rect class="prize-part" data-index="${i}" x="35" y="${(y + segGap / 2).toFixed(1)}" width="30" height="${(segH - segGap).toFixed(1)}" rx="3" fill="#EDEAE0" opacity="0.6"></rect>`;
    }
    return `<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,8 33,48 67,48" fill="white" stroke="#1F2430" stroke-width="2.5"/>
      <rect x="33" y="48" width="34" height="70" rx="6" fill="white" stroke="#1F2430" stroke-width="2.5"/>
      ${segs}
      <circle cx="50" cy="64" r="9" fill="#BFE3FF" stroke="#1F2430" stroke-width="2"/>
      <polygon points="33,92 18,114 33,114" fill="white" stroke="#1F2430" stroke-width="2"/>
      <polygon points="67,92 82,114 67,114" fill="white" stroke="#1F2430" stroke-width="2"/>
      <path class="flame" data-flame="1" d="M40,118 L50,144 L60,118 Z" fill="#FF6B5E" opacity="0"/>
    </svg>`;
  }

  function buildSubmarineSVG(n) {
    const startX = 40, endX = 118;
    const step = n > 1 ? (endX - startX) / (n - 1) : 0;
    let portholes = '';
    for (let i = 0; i < n; i++) {
      const cx = n > 1 ? startX + step * i : (startX + endX) / 2;
      portholes += `<circle class="prize-part" data-index="${i}" cx="${cx.toFixed(1)}" cy="45" r="7" fill="white" stroke="#1F2430" stroke-width="2" opacity="0.8"></circle>`;
    }
    return `<svg viewBox="0 0 160 90" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="80" cy="45" rx="58" ry="25" fill="white" stroke="#1F2430" stroke-width="2.5"/>
      <rect x="72" y="10" width="8" height="16" rx="2" fill="white" stroke="#1F2430" stroke-width="2"/>
      <polygon points="138,45 158,36 158,54" fill="white" stroke="#1F2430" stroke-width="2"/>
      ${portholes}
    </svg>`;
  }

  function updatePrizeLabel(count, total) {
    const word = theme === 'space' ? 'Fuel' : 'Windows';
    prizeLabel.innerHTML = `${word}<br>${count}/${total}`;
  }

  function buildPrizeStage() {
    prizeStage.className = 'prize-stage';
    prizeStage.innerHTML = theme === 'space' ? buildRocketSVG(totalPairs) : buildSubmarineSVG(totalPairs);
    updatePrizeLabel(0, totalPairs);
  }

  function revealPrizePart(index) {
    const el = prizeStage.querySelector(`[data-index="${index}"]`);
    if (el) {
      el.setAttribute('fill', theme === 'space' ? '#FFC857' : '#4C9AFF');
      el.setAttribute('opacity', '1');
    }
    updatePrizeLabel(matchedCount, totalPairs);
  }

  function spawnBubbles() {
    for (let i = 0; i < 7; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 6 + Math.random() * 10;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = (8 + Math.random() * 84) + '%';
      b.style.animationDelay = (Math.random() * 0.4) + 's';
      prizeStage.appendChild(b);
      setTimeout(() => b.remove(), 1700);
    }
  }

  function launchPrize() {
    prizeStage.classList.add('launching', theme);
    if (theme === 'space') {
      const flame = prizeStage.querySelector('[data-flame]');
      if (flame) flame.style.opacity = '1';
    } else {
      spawnBubbles();
    }
  }

  function buildBoard() {
    banner.classList.remove('show');
    board.innerHTML = '';
    moves = 0;
    matchedCount = 0;
    movesEl.textContent = '0';
    flipped = [];
    lockBoard = false;

    const pairs = makePairs(level);
    totalPairs = pairs.length;
    buildPrizeStage();

    const cells = [];
    pairs.forEach((p, i) => {
      cells.push({ id: 'q' + i, pairId: i, label: p.question });
      cells.push({ id: 'a' + i, pairId: i, label: p.answer });
    });
    shuffle(cells);

    board.style.gridTemplateColumns = `repeat(${cells.length <= 12 ? 4 : 4}, 1fr)`;

    cells.forEach(cell => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.pairId = cell.pairId;

      const inner = document.createElement('div');
      inner.className = 'card-inner';

      const back = document.createElement('div');
      back.className = 'face face-back';

      const front = document.createElement('div');
      front.className = 'face face-front';
      front.textContent = cell.label;

      inner.appendChild(back);
      inner.appendChild(front);
      card.appendChild(inner);
      card.addEventListener('click', () => onCardClick(card));
      board.appendChild(card);
    });

    startTimer();
  }

  let audioCtx = null;
  let muted = false;

  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playTone(freq, startTime, duration, type, peakGain) {
    if (muted) return;
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, startTime);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  function playCorrectSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    playTone(523.25, now, 0.14, 'sine', 0.18);
    playTone(783.99, now + 0.1, 0.22, 'sine', 0.18);
  }

  function playWrongSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    playTone(220, now, 0.18, 'sine', 0.12);
    playTone(180, now + 0.1, 0.22, 'sine', 0.12);
  }

  function playWinSound() {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      playTone(f, now + i * 0.11, 0.24, 'sine', 0.16);
    });
  }

  const feedbackEl = document.getElementById('feedback');
  let feedbackTimer = null;

  const correctPhrases = ['Good job!', 'Nice one!', 'You got it!', 'Great match!', 'Well done!'];
  const wrongPhrases = ['Keep going!', 'Try again!', 'So close!', 'Keep it up!', 'Almost!'];

  function showFeedback(text, type) {
    clearTimeout(feedbackTimer);
    feedbackEl.textContent = text;
    feedbackEl.className = 'feedback show ' + type;
    feedbackTimer = setTimeout(() => {
      feedbackEl.classList.remove('show');
    }, 900);
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function onCardClick(card) {
    if (lockBoard) return;
    if (card.classList.contains('flipped') || card.classList.contains('matched')) return;

    card.classList.add('flipped');
    flipped.push(card);

    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = String(moves);
      const [c1, c2] = flipped;
      if (c1.dataset.pairId === c2.dataset.pairId) {
        c1.classList.add('matched');
        c2.classList.add('matched');
        flipped = [];
        matchedCount++;
        showFeedback(pick(correctPhrases), 'correct');
        playCorrectSound();
        revealPrizePart(matchedCount - 1);
        if (matchedCount === totalPairs) {
          setTimeout(finishGame, 500);
        }
      } else {
        lockBoard = true;
        c1.classList.add('wrong');
        c2.classList.add('wrong');
        showFeedback(pick(wrongPhrases), 'wrong');
        playWrongSound();
        setTimeout(() => {
          c1.classList.remove('flipped', 'wrong');
          c2.classList.remove('flipped', 'wrong');
          flipped = [];
          lockBoard = false;
        }, 700);
      }
    }
  }

  function finishGame() {
    clearInterval(timerId);
    playWinSound();
    launchPrize();
    const m = Math.floor(seconds / 60);
    const s = String(seconds % 60).padStart(2, '0');
    if (theme === 'space') {
      bannerTitle.textContent = '🚀 Blast off!';
      bannerText.textContent = `Fuel tank full — rocket launched! ${moves} moves, ${m}:${s}.`;
    } else {
      bannerTitle.textContent = '🌊 Dive complete!';
      bannerText.textContent = `All windows lit — submarine's diving! ${moves} moves, ${m}:${s}.`;
    }
    setTimeout(() => banner.classList.add('show'), 700);
  }

  levelButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      levelButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      level = btn.dataset.level;
      buildBoard();
    });
  });

  document.getElementById('againBtn').addEventListener('click', buildBoard);

  themeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      themeButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      theme = btn.dataset.theme;
      buildBoard();
    });
  });

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  buildBoard();
</script>
</body>
</html>
